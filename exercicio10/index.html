<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Soma de dois números</title>
     <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h2>Somar dois números</h2>

    <input type="number" id="numero1" placeholder="Primeiro número" />
    <input type="number" id="numero2" placeholder="Segundo número" />

    <button onclick="somar()">Somar</button>

    <p id="resultado"></p>

    <hr />

    <h2>Somar novamente</h2>

    <input type="number" id="numero3" placeholder="Terceiro número" />
    <input type="number" id="numero4" placeholder="Quarto número" />

    <button onclick="somarNovamente()">Somar de novo</button>

    <p id="resultado2"></p>

    <script>
      function somarDoisNumeros(numero1, numero2) {
        return numero1 + numero2;
      }

      function somar() {
        let n1 = Number(document.getElementById("numero1").value);
        let n2 = Number(document.getElementById("numero2").value);

        let total = somarDoisNumeros(n1, n2);

        document.getElementById("resultado").textContent =
          "Resultado: " + total;
      }

      function somarNovamente() {
        let n3 = Number(document.getElementById("numero3").value);
        let n4 = Number(document.getElementById("numero4").value);

        let total = somarDoisNumeros(n3, n4);

        document.getElementById("resultado2").textContent =
          "Novo resultado: " + total;
      }
    </script>
  </body>
</html>
