<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Temperatura</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <h1>Conversor de Celsius para Fahrenheit</h1>

    <label for="celsius">Digite a temperatura em Celsius:</label>
    <input type="number" id="celsius" />

    <button onclick="converter()">Converter</button>

    <p id="resultado"></p>

    <script>
      function converterCelsiusParaFahrenheit(celsius) {
        return (celsius * 9) / 5 + 32;
      }

      function converter() {
        const celsius = Number(document.getElementById("celsius").value);
        const fahrenheit = converterCelsiusParaFahrenheit(celsius);

        document.getElementById("resultado").textContent =
          celsius + "°C = " + fahrenheit + "°F";
      }
    </script>
  </body>
</html>
